<!doctype html>
<html lang="en" style="height: 100%; margin: 0; padding: 0">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <script>
      window.__PI_HOME__ = "PI_HOME_PLACEHOLDER";
      window.__PI_SEP__ = "PI_SEP_PLACEHOLDER";
      window.__PI_WORKSPACE__ = "PI_WORKSPACE_PLACEHOLDER";
      window.__PI_FONTSIZE__ = PI_FONTSIZE_PLACEHOLDER;
      window.__PI_LANG__ = "PI_LANG_PLACEHOLDER";
      window.__PI_MERMAID_THEME__ = "PI_MERMAID_THEME_PLACEHOLDER";
      window.__PI_BG_IMAGE__ = "PI_BG_IMAGE_PLACEHOLDER";
      window.__PI_BG_OPACITY__ = PI_BG_OPACITY_PLACEHOLDER;
      window.__PI_SEND_SHORTCUT__ = "PI_SENDSHORTCUT_PLACEHOLDER";
    </script>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-card">
        <div class="boot-logo"></div>
        <div class="boot-dots"><span></span><span></span><span></span></div>
        <div class="boot-error" id="boot-error">
          <div class="boot-error-msg" id="boot-error-msg"></div>
          <button id="boot-retry" class="boot-retry" type="button"></button>
        </div>
      </div>
    </div>
    <div class="app">
      <div class="toolbar">
        <!-- Back to the "home" state: starts a fresh session instead of
             continuing the current one. -->
        <button id="new-chat-btn" class="icon-btn" type="button">
          <span class="codicon codicon-add"></span>
        </button>
        <span class="session-info" id="session-info"></span>
        <input id="name-input" class="name-input" type="text" style="display: none" />
        <span class="status" id="status"></span>
        <button id="name-btn" class="icon-btn" type="button">
          <span class="codicon codicon-edit"></span>
        </button>
        <button id="refresh-btn" class="icon-btn" type="button">
          <span class="codicon codicon-refresh"></span>
        </button>
        <div class="select-wrap sessions-wrap" id="sessions-wrap">
          <button id="sessions-btn" class="icon-btn" type="button">
            <span class="codicon codicon-server"></span>
          </button>
          <div class="sessions-popup" id="sessions-popup" style="display: none">
            <div class="picker-title" id="sessions-title"></div>
            <div class="sessions-list" id="sessions-list"></div>
          </div>
        </div>
        <button id="settings-btn" class="icon-btn" type="button">
          <span class="codicon codicon-settings-gear"></span>
        </button>
      </div>
      <div class="messages-wrap">
        <div class="messages" id="messages">
          <div class="messages-inner" id="messages-inner"></div>
        </div>
        <button
          class="scroll-bottom-btn"
          id="scroll-bottom-btn"
          type="button"
          title="Scroll to bottom"
        >
          <span class="codicon codicon-chevron-down"></span>
        </button>
        <div class="toast" id="toast"></div>
      </div>
      <div id="rewind-widget" class="rewind-widget" style="display: none"></div>
      <div id="widget" class="widget" style="display: none"></div>
      <div id="queue" class="queue" style="display: none"></div>
      <div class="composer">
        <div class="autocomplete" id="autocomplete" style="display: none"></div>
        <div class="composer-box">
          <div class="attach-preview" id="attach-preview" style="display: none"></div>
          <div
            id="input"
            class="composer-input"
            contenteditable="true"
            role="textbox"
            aria-multiline="true"
            data-placeholder="Ask anything…  (use / for commands, @ for files)"
          ></div>
          <div class="composer-controls-bar">
            <button id="attach-btn" class="icon-btn" type="button">
              <span class="codicon codicon-add"></span>
            </button>
            <div class="select-wrap model-wrap" id="model-wrap">
              <button id="model-trigger" class="model-trigger" type="button">
                <span class="model-icon-slot" id="model-icon"></span>
                <span class="model-trigger-label" id="model-trigger-label"></span>
              </button>
              <div class="model-popup" id="model-popup" style="display: none">
                <div class="picker-title" id="model-title"></div>
                <input
                  id="model-search"
                  class="model-search"
                  type="text"
                  placeholder="Search models…"
                  autocomplete="off"
                />
                <div class="model-list" id="model-list"></div>
                <!-- Second level. The thinking level used to be its own pill in
                     the control bar; it lives here now so the bar can keep its
                     room for the model and permission labels. -->
                <div class="select-wrap thinking-wrap" id="thinking-wrap">
                  <button id="thinking-trigger" class="thinking-trigger" type="button">
                    <span class="codicon codicon-sparkle thinking-icon"></span>
                    <span class="thinking-row-label" id="thinking-row-label"></span>
                    <span class="thinking-trigger-label" id="thinking-trigger-label"></span>
                    <span class="codicon codicon-chevron-right thinking-row-arrow"></span>
                  </button>
                  <div class="thinking-popup" id="thinking-popup" style="display: none">
                    <div class="picker-title" id="thinking-title"></div>
                    <div class="thinking-list" id="thinking-list"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="select-wrap permission-wrap" id="permission-wrap">
              <button id="permission-trigger" class="permission-trigger" type="button">
                <span class="codicon permission-icon" id="permission-icon"></span>
                <span class="permission-trigger-label" id="permission-trigger-label"></span>
              </button>
              <div class="permission-popup" id="permission-popup" style="display: none">
                <div class="picker-title" id="permission-title"></div>
                <div class="permission-list" id="permission-list"></div>
              </div>
            </div>
            <div class="composer-spacer"></div>
            <span class="ctx-ring" id="ctx-ring" title="Context usage"
              ><svg viewBox="0 0 16 16">
                <circle class="ctx-ring-track" cx="8" cy="8" r="6"></circle>
                <circle
                  class="ctx-ring-prog"
                  id="ctx-ring-prog"
                  cx="8"
                  cy="8"
                  r="6"
                  pathLength="100"
                ></circle></svg
            ></span>
            <button id="send" class="icon-btn send-btn" type="button">
              <span class="codicon codicon-send"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="overlay" id="overlay" style="display: none"></div>
    <div class="ctx-menu" id="ctx-menu" style="display: none">
      <button class="ctx-item" id="ctx-copy" type="button">Copy</button>
      <button class="ctx-item" id="ctx-fork" type="button">Fork from here</button>
      <button class="ctx-item" id="ctx-revert" type="button">Revert here</button>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
